<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哞界覺醒者 - 遊戲系統</title>
  <style>
    :root {
      --primary: #4a90e2;
      --danger: #e74c3c;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
      position: relative;
    }

    .title {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: #f1c40f;
    }

    .status-box {
      font-size: 1.2rem;
      margin: 20px 0;
      padding: 15px;
      background: #2a2a2a;
      border-radius: 8px;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #444;
      background: #333;
      color: #fff;
      font-size: 1rem;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      background-color: var(--primary);
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #357abd;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.9rem;
      margin-top: 5px;
      display: none;
    }

    /* 突襲動畫 overlay (僅供玩家端使用) */
    #raidOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(231, 76, 60, 0.85);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: flash 0.8s infinite alternate;
    }

    #raidOverlay h1 {
      font-size: 3rem;
      color: #fff;
      text-shadow: 0 0 10px #000;
      margin: 0;
    }

    @keyframes flash {
      from { background: rgba(231, 76, 60, 0.9); }
      to { background: rgba(192, 57, 43, 0.95); }
    }
  </style>
</head>
<body>

  <!-- 全螢幕突襲動畫遮罩 (玩家端限定 20秒) -->
  <div id="raidOverlay">
    <h1>⚠️ RAID ALERT ⚠️</h1>
    <p>突襲發生中！請準備...</p>
  </div>

  <div class="container">
    <div class="title" id="achievementTitle">Title: Cow-World Awakener</div>

    <!-- 房號輸入區域 -->
    <div id="joinSection">
      <h3>輸入房號以加入遊戲</h3>
      <input type="text" id="roomCodeInput" placeholder="請輸入房號 (例如: 8888)">
      <br>
      <button onclick="joinRoom()">進入房間</button>
      <div id="errorMessage" class="error-msg">房號輸入錯誤，請確認後重新輸入</div>
    </div>

    <!-- 狀態顯示區域 -->
    <div id="gameSection" style="display: none;">
      <div id="statusText" class="status-box">
        Waiting for store opening...
      </div>
      <button onclick="triggerRaidEvent()">模擬觸發突襲事件</button>
    </div>
  </div>

  <script>
    // 角色身份設定：'player' 或 'host'
    const role = 'player'; 

    // 加入房間與錯誤邏輯判定
    function joinRoom() {
      const input = document.getElementById('roomCodeInput').value.trim();
      const errorMsg = document.getElementById('errorMessage');

      // 檢查是否為正確房號 (範例預設正確房號為 8888)
      if (input === '8888') {
        errorMsg.style.display = 'none';
        document.getElementById('joinSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'block';
      } else {
        // 修正房號錯誤之顯示訊息，避免誤報為網路連線失敗
        errorMsg.innerText = "房號輸入錯誤，請確認後重新輸入";
        errorMsg.style.display = 'block';
      }
    }

    // 觸發突襲動畫邏輯
    function triggerRaidEvent() {
      // 判斷是否為主持端：主持端不播放動畫
      if (role === 'host') {
        console.log("主持端：忽略突襲動畫");
        return;
      }

      // 玩家端：顯示全螢幕動畫並持續 20 秒
      const overlay = document.getElementById('raidOverlay');
      overlay.style.display = 'flex';

      setTimeout(() => {
        overlay.style.display = 'none';
      }, 20000); // 延長至 20 秒 (20000 ms)
    }
  </script>
</body>
</html>
